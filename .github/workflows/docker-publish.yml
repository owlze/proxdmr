name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/owlze/proxdmr
  DOCKERHUB_IMAGE: docker.io/andrelli/proxdmr

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,"name=${{ env.GHCR_IMAGE }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Manifests
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS=("sha-${SHORT_SHA}")

          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAGS+=("latest")
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_RAW="${GITHUB_REF_NAME}"
            TAG_CLEAN="${TAG_RAW#v}"
            TAGS+=("${TAG_RAW}")
            if [ "${TAG_CLEAN}" != "${TAG_RAW}" ] && [ -n "${TAG_CLEAN}" ]; then
              TAGS+=("${TAG_CLEAN}")
            fi
          fi

          GHCR_ARGS=()
          DH_ARGS=()
          for t in "${TAGS[@]}"; do
            GHCR_ARGS+=(-t "${GHCR_IMAGE}:${t}")
            DH_ARGS+=(-t "${DOCKERHUB_IMAGE}:${t}")
          done

          GHCR_DIGESTS=()
          DH_DIGESTS=()
          for f in *; do
            GHCR_DIGESTS+=("${GHCR_IMAGE}@sha256:${f}")
            DH_DIGESTS+=("${DOCKERHUB_IMAGE}@sha256:${f}")
          done

          echo "Publishing GHCR tags: ${TAGS[*]}"
          docker buildx imagetools create "${GHCR_ARGS[@]}" "${GHCR_DIGESTS[@]}"

          echo "Publishing Docker Hub tags: ${TAGS[*]}"
          docker buildx imagetools create "${DH_ARGS[@]}" "${DH_DIGESTS[@]}"

          docker buildx imagetools inspect "${GHCR_IMAGE}:${TAGS[0]}"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${TAGS[0]}"

      - name: Sync README and Short Description to Docker Hub
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: andrelli/proxdmr
          short-description: "Multi-protocol amateur radio web & Android transceiver: DMR, YSF, D-STAR, M17, SVXLink, XLX & ASL3."
          readme-filepath: ./README.md
