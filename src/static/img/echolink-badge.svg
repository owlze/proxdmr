<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="100%" height="100%">
  <!-- Cyan rounded background -->
  <rect x="0" y="0" width="250" height="250" rx="28" fill="#28c7ff" />
  
  <!-- Red antenna beacon -->
  <rect x="118" y="30" width="14" height="34" rx="4" fill="#ef4136" />
  
  <!-- Red radiation waves -->
  <g stroke="#ef4136" stroke-width="8" stroke-linecap="round">
    <!-- Left ticks -->
    <line x1="98" y1="37" x2="81" y2="29" />
    <line x1="100" y1="48" x2="75" y2="52" />
    <line x1="100" y1="62" x2="75" y2="72" />
    <!-- Right ticks -->
    <line x1="150" y1="37" x2="167" y2="28" />
    <line x1="148" y1="48" x2="173" y2="52" />
    <line x1="149" y1="61" x2="173" y2="72" />
  </g>
  
  <!-- Black transmission tower -->
  <g stroke="#000000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top platform bar -->
    <line x1="110" y1="66" x2="140" y2="66" stroke-width="10" />
    <!-- Main legs -->
    <line x1="110" y1="66" x2="55" y2="214" stroke-width="10" />
    <line x1="140" y1="66" x2="195" y2="214" stroke-width="10" />
    
    <!-- Top cross braces (X1) -->
    <line x1="110" y1="66" x2="159" y2="118" />
    <line x1="140" y1="66" x2="90" y2="118" />
    
    <!-- Mid cross braces (X2) -->
    <line x1="90" y1="118" x2="179" y2="170" />
    <line x1="159" y1="118" x2="71" y2="170" />
    
    <!-- Bottom inverted arch -->
    <path d="M 71 170 L 125 208 L 179 170" />
    <path d="M 55 214 L 125 208 L 195 214" />
  </g>
</svg>
